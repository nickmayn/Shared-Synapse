[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-cli"
version = "0.1.0"
description = "CLI agent for Shared Synapse – search, add knowledge, and connect local agents"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "toml>=0.10.2",
    "PyYAML>=6.0",
]

[project.scripts]
synapse = "synapse_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
