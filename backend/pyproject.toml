[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-synapse"
version = "0.1.0"
description = "A centralized MCP-powered intelligence layer"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.0",
    "PyYAML>=6.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.7.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
